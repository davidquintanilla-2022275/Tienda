<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet" th:href="@{/usuarios.css}">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>Synaptech</h2>

    <div class="nav-buttons">
        <a th:href="@{/home}">
            <button>Home</button>
        </a>
        <a th:href="@{/clientes}">
            <button>Clientes</button>
        </a>
        <a th:href="@{/usuarios}">
            <button>Usuarios</button>
        </a>
        <a th:href="@{/productos}">
            <button>Productos</button>
        </a>
        <a th:href="@{/ventas}">
            <button>Ventas</button>
        </a>
        <a th:href="@{/detalle-venta}">
            <button>Detalle de la venta</button>
        </a>
    </div>

    <a th:href="@{/logout}">
        <button class="logout">Cerrar sesión</button>
    </a>
</div>

<!-- CONTENIDO -->
<div class="container">

    <div class="card">

        <div class="header">
            <h1>Gestión de Usuarios</h1>
        </div>

        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">

            <input type="hidden" th:field="*{codigousuario}">

            <input type="text" th:field="*{username}" placeholder="Usuario" required>

            <input type="email" th:field="*{email}" placeholder="Email">

            <input type="text" th:field="*{rol}" placeholder="Rol">

            <select th:field="*{estado}">
                <option value="1">Activo</option>
                <option value="0">Inactivo</option>
            </select>

            <button type="submit" class="save-btn">Guardar</button>

        </form>

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="u : ${usuarios}">
                <td th:text="${u.codigousuario}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.rol}"></td>
                <td th:text="${u.estado == 1 ? 'Activo' : 'Inactivo'}"></td>

                <!-- ACCIONES -->
                <td>
                    <a th:href="@{'/usuarios/editar/' + ${u.codigousuario}}">
                        <button class="edit">Editar</button>
                    </a>

                    <a th:href="@{'/usuarios/eliminar/' + ${u.codigousuario}}"
                       onclick="return confirm('¿Seguro que deseas eliminar este usuario?');">
                        <button class="delete">Eliminar</button>
                    </a>
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
